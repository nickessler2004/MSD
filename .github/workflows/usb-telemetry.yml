name: ESP32 USB telemetry
on:
  pull_request:
    paths:
      - "firmware/**"
      - "tools/serial_bridge/**"
      - ".github/workflows/usb-telemetry.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tools/serial_bridge/**"
      - ".github/workflows/usb-telemetry.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [adafruit_feather_esp32s3_reversetft, adafruit_feather_esp32s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install -r tools/serial_bridge/requirements.txt
      - run: python -m unittest discover -s tools/serial_bridge/tests -v
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.3.1"
      - run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.5
          arduino-cli compile --fqbn esp32:esp32:${{ matrix.board }}:USBMode=default,CDCOnBoot=cdc firmware/usb_simulator
